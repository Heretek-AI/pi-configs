name: Publish to NPM (Trusted Publishing with OIDC)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade npm to v11+ (Required for native OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Run verification checks
        run: node scripts/verify_mission_completion.js

      - name: Clear conflicting .npmrc
        run: rm -f ~/.npmrc

      - name: Publish to NPM via OIDC with Provenance (with retry)
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt: Publishing to NPM via OIDC..."
            if npm publish --provenance --access public --verbose; then
              echo "Successfully published to NPM on attempt $attempt!"
              exit 0
            fi
            echo "Attempt $attempt failed. Backing off for 15s before retry..."
            sleep 15
          done
          echo "::error::Publish failed after 3 attempts. Dumping logs:"
          cat /home/runner/.npm/_logs/*-debug-0.log || true
          exit 1
