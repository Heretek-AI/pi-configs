hooks:
  - event: file.changed
    filter:
      matchesCodeFiles: ["*.wit"]
    action: bash
    command: |
      wasm-tools component wit "$PI_FILE_PATH"
  - event: tool.before.*
    filter:
      tool: [bash]
    action: bash
    command: |
      if echo "$PI_TOOL_ARGS" | grep -E "(git push --force|rm -rf /)"; then
        echo "Dangerous command blocked in wasm-runtime-engineer hook." >&2
        exit 2
      fi
  - event: user.prompt.submit
    action: bash
    command: |
      echo "[context-injection] Specialist 'wasm-runtime-engineer' active. Working directory: $(pwd)"
