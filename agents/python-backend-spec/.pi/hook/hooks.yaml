hooks:
  - event: file.changed
    filter:
      matchesCodeFiles: ["*.py"]
    action: bash
    command: |
      ruff check --fix "$PI_FILE_PATH" && ruff format "$PI_FILE_PATH"
  - event: tool.before.*
    filter:
      tool: [bash]
    action: bash
    command: |
      if echo "$PI_TOOL_ARGS" | grep -E "(pip install --user|pip install -e \.)"; then
        echo "Policy Violation: Use pinned uv commands rather than raw pip installations." >&2
        exit 2
      fi
  - event: user.prompt.submit
    action: bash
    command: |
      echo "[context-injection] Specialist 'python-backend-spec' active. Working directory: $(pwd)"
