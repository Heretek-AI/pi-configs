hooks:
  - event: file.changed
    filter:
      matchesCodeFiles: ["rag/**/*.py", "src/retrieval/**/*.py"]
    action: bash
    command: |
      ruff check --fix "$PI_FILE_PATH"
  - event: tool.before.*
    filter:
      tool: [bash]
    action: bash
    command: |
      if echo "$PI_TOOL_ARGS" | grep -E "(git push --force|rm -rf /)"; then
        echo "Dangerous command blocked in vector-rag-spec hook." >&2
        exit 2
      fi
  - event: user.prompt.submit
    action: bash
    command: |
      echo "[context-injection] Specialist 'vector-rag-spec' active. Working directory: $(pwd)"
