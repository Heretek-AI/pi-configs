hooks:
  - event: file.changed
    filter:
      matchesCodeFiles: ["Source/**/*.cpp", "Source/**/*.h"]
    action: bash
    command: |
      clang-format -i "$PI_FILE_PATH"
  - event: tool.before.*
    filter:
      tool: [bash]
    action: bash
    command: |
      if echo "$PI_TOOL_ARGS" | grep -E "(git push --force|rm -rf /)"; then
        echo "Dangerous command blocked in ue-unreal-engine-architect hook." >&2
        exit 2
      fi
  - event: user.prompt.submit
    action: bash
    command: |
      echo "[context-injection] Specialist 'ue-unreal-engine-architect' active. Working directory: $(pwd)"
